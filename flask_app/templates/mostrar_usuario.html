
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
</head>
<body>
    <h1>Nuevo Usuario</h1>

    <form action="/crear_usuario" method="POST">
        <p>Nombre:
            <input type="text" name="nombre" required>
        </p>
        <p>Email:
            <input type="email" name="email" required>
        </p>
        <p>Contraseña:
            <input type="password" name="password" required>
        </p>
        <button type="submit">Crear</button>
    </form>

    <h1>Todos los Usuarios</h1>

    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.email }}</td>
            <td>
                <a href="/usuarios/{{ usuario.id }}">Ver</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/canciones">Agregar Canción</a></p>
</body>
</html>
